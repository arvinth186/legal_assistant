[project]
name = "legalassistant"
version = "0.1.0"
description = "LegalAssistant using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.15"
dependencies = [
    "crewai[litellm,tools]>=0.102.0",
    "fastapi>=0.136.3",
    "langchain>=1.3.7",
    "langchain-chroma>=1.0.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.5.1",
    "streamlit>=1.58.0",
    "tavily-python>=0.7.26",
    "uvicorn>=0.49.0",
]

[project.scripts]
legalassistant = "legalassistant.main:run"
run_crew = "legalassistant.main:run"
train = "legalassistant.main:train"
replay = "legalassistant.main:replay"
test = "legalassistant.main:test"
run_with_trigger = "legalassistant.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
